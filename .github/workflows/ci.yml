name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  font:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python font/scripts/build.py --no-proof
      - run: python -m pytest tests/font -q
      - name: Committed font files match the build
        run: git diff --stat --exit-code -- font/builds/stacks.txt cdn/vedicnepali.css cdn/vedicnepali-static.css

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vedicnepali/engine build
      - run: pnpm --filter @vedicnepali/keyboard build
      - run: pnpm -r typecheck
      - run: pnpm -r test

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          # the default ("tools platform-tools") fails: current sdkmanager has no "tools" package
          packages: platform-tools platforms;android-35
      - working-directory: android
        run: ./gradlew :engine:test :app:assembleDebug --console=plain

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Bundled iOS data matches engine/
        run: ios/scripts/sync-resources.sh || true; git diff --stat --exit-code -- ios/VedicNepaliEngine
      - working-directory: ios/VedicNepaliEngine
        run: swift test
      - name: Build the app and keyboard extension (with ML Kit pods)
        working-directory: ios
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          brew install xcodegen
          xcodegen
          pod install
          xcodebuild -workspace VedicNepali.xcworkspace -scheme VedicNepali -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
