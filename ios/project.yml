# XcodeGen spec: `brew install xcodegen && cd ios && ./scripts/sync-resources.sh && xcodegen`
name: VedicNepali
options:
  bundleIdPrefix: np.vedicnepali
  deploymentTarget:
    iOS: "16.0"
packages:
  VedicNepaliEngine:
    path: VedicNepaliEngine
targets:
  VedicNepali:
    type: application
    platform: iOS
    sources:
      - VedicNepaliApp
      - Shared
      - path: Fonts
        type: folder
        buildPhase: resources
    dependencies:
      - package: VedicNepaliEngine
      - target: VedicNepaliKeyboard
    entitlements:
      path: VedicNepaliApp/VedicNepali.entitlements
      properties:
        # install the Vedic Nepali fonts for all apps (CTFontManagerRegisterFontURLs .persistent)
        com.apple.developer.user-fonts: [system-installation]
        # settings the app writes and the keyboard reads (VedicNepaliSettings)
        com.apple.security.application-groups: [group.np.vedicnepali.keyboard]
    info:
      path: VedicNepaliApp/Info.plist
      properties:
        CFBundleDisplayName: Vedic Nepali
        # no encryption beyond what iOS provides: TestFlight and review skip the export-compliance question
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSupportsIndirectInputEvents: true
    preBuildScripts:
      - script: '"$SRCROOT/scripts/sync-resources.sh"'
        name: Sync Vedic Nepali resources
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: np.vedicnepali.keyboard
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
  VedicNepaliKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - VedicNepaliKeyboard
      - Shared
      - path: Fonts/VedicNepali-Variable.ttf
        buildPhase: resources
    dependencies:
      - package: VedicNepaliEngine
    entitlements:
      path: VedicNepaliKeyboard/VedicNepaliKeyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.np.vedicnepali.keyboard]
    info:
      path: VedicNepaliKeyboard/Info.plist
      properties:
        CFBundleDisplayName: Vedic Nepali
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: ne-NP
            # Full Access only lets the handwriting model download once; typing never uses the network.
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: np.vedicnepali.keyboard.extension
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
